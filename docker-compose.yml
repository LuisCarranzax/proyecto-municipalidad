services:
  # 1. Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: municipalidad_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_municipalidad
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d

  # 2. Microservicio de IA (Python)
  ml_api:
    build: ./ml_model
    container_name: municipalidad_ml
    ports:
      - "8000:8000"
    restart: unless-stopped

  # 3. Backend (Node.js)
  backend:
    build: ./backend
    container_name: municipalidad_backend
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=db_municipalidad
      - ML_API_URL=http://ml_api:8000/predict
    ports:
      - "3000:3000"
    depends_on:
      - db
      - ml_api
    restart: unless-stopped

  # 4. Frontend (React)
  frontend:
    build: ./frontend
    container_name: municipalidad_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
